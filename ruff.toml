line-length = 110
target-version = "py310"
extend-exclude = [".venv", "frontend"]

[lint]
# UP017 (datetime.UTC) would break Python 3.10 support.
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "UP040", "SIM108", "UP017"]

[lint.per-file-ignores]
"backend/tests/*" = ["S101", "S311", "S105", "B017", "RUF012"]
"scripts/*" = ["E402"]

[lint.isort]
known-first-party = ["ppml"]
