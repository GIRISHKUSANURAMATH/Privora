services:
  umbra:
    build: .
    image: umbra-ppml:1.0.0
    # Published on the loopback interface only: the API has no authentication.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - umbra-data:/data
    environment:
      PPML_MAX_UPLOAD_MB: "20"
      PPML_MAX_CONCURRENT_JOBS: "1"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  umbra-data:
