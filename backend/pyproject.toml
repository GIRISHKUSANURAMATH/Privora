[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "privora"
version = "1.0.0"
description = "Privora — a privacy-preserving machine learning framework (DP-SGD, federated learning, privacy attacks)"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["ppml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:opacus.*",
    "ignore:.*Secure RNG.*:UserWarning",
    "ignore:.*full_backward_hook.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
